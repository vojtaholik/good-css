<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>good-css specimens</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./harness.css">
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!-- header -->

    <main>
      <section class="hero content-grid">
        <div class="hero-title">
          <h1><img src="/wordmark.svg" alt="good-css" width="711" height="95"></h1>
          <p>From experts for agents.</p>
        </div>

        <!-- install-command -->

        <a class="badge" href="https://is-agentic.com/scan/good-css.vercel.app">
          <strong>100/100</strong>
          <span>Your agent can read this site.</span>
        </a>
      </section>

      <section class="categories content-grid" aria-labelledby="categories-title">
        <h2 id="categories-title">Categories</h2>

        <ul class="carousel" data-slot="cards"></ul>

        <div class="carousel-controls">
          <div class="carousel-progress" aria-hidden="true"></div>
          <p class="carousel-count">
            <b data-slot="current">01</b>
            <span>/ <span data-slot="total"></span></span>
          </p>
          <div class="carousel-buttons">
            <button type="button" data-carousel-dir="-1" aria-label="Previous category">
              <img src="/arrow.svg" alt="">
            </button>
            <button type="button" data-carousel-dir="1" aria-label="Next category">
              <img src="/arrow.svg" alt="">
            </button>
          </div>
        </div>
      </section>

      <div data-slot="categories"></div>
    </main>

    <!-- footer -->

    <template id="card">
      <li>
        <a class="card">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-title" data-slot="title"></span>
        </a>
      </li>
    </template>

    <template id="category">
      <section class="category content-grid">
        <div class="category-layout">
          <h2><span data-slot="title"></span></h2>
          <div class="entries" data-slot="entries"></div>
        </div>
      </section>
    </template>

    <template id="entry">
      <article class="entry">
        <h3 data-slot="title"></h3>
        <p class="lede" data-slot="lede"></p>

        <div data-slot="specimen"></div>

        <details class="fold fold-source">
          <summary>Code</summary>
          <div class="prose" data-slot="source"></div>
        </details>

        <details class="fold">
          <summary>Why it works, the rules and the credits</summary>
          <div class="prose" data-slot="notes"></div>
        </details>
      </article>
    </template>

    <template id="specimen">
      <figure class="specimen">
        <div class="viewport">
          <div class="viewport-bar">
            <span class="viewport-size" data-slot="size"></span>
            <div class="viewport-widths" role="group" aria-label="Frame width">
              <button type="button" data-width="360">360</button>
              <button type="button" data-width="768">768</button>
              <button type="button" data-width="full">100%</button>
            </div>
            <a
              data-slot="open"
              target="_blank"
              title="Open in its own tab"
              aria-label="Open this specimen in its own tab"
            >
              <img src="/icons/link-square.svg" alt="">
            </a>
          </div>
          <iframe data-slot="frame"></iframe>
          <button
            class="viewport-grip"
            type="button"
            aria-label="Resize the frame, by dragging or with the arrow keys"
          >
            <img src="/icons/resize.svg" alt="">
          </button>
        </div>

        <figcaption class="check">
          <img src="/icons/info.svg" alt="Check:">
          <span data-slot="check"></span>
        </figcaption>
      </figure>
    </template>

    <template id="no-specimen">
      <div class="no-specimen">
        <p>No specimen is drawn for this entry yet.</p>
        <p>Add <code data-slot="file"></code>.</p>
      </div>
    </template>
  </body>
</html>
