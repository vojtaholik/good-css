<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>good-css specimens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./harness.css">
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="guides content-grid" aria-hidden="true">
      <i></i>
    </div>

    <header class="masthead content-grid">
      <h1 data-slot="title"></h1>

      <div class="masthead-body">
        <div class="masthead-lead">
          <p class="masthead-statement" data-slot="statement"></p>

          <div class="install">
            <p class="label">Install it as an agent skill</p>
            <div class="install-command">
              <code>npx skills@latest add vojtaholik/good-css</code>
              <button type="button" aria-live="polite" data-copy>Copy</button>
            </div>
            <p>
              For Claude Code, Codex, Cursor and any other agent that reads skills. The source and
              the other ways to install are on
              <a href="https://github.com/vojtaholik/good-css">GitHub</a>.
            </p>
          </div>
        </div>

        <div class="prose" data-slot="intro"></div>
      </div>

      <div class="index" id="index">
        <dl class="title-block">
          <div>
            <dt>Source</dt>
            <dd>[ PRACTICES.md ]</dd>
          </div>
          <div>
            <dt>Entries</dt>
            <dd data-slot="entry-count"></dd>
          </div>
          <div>
            <dt>With a specimen</dt>
            <dd data-slot="specimen-count"></dd>
          </div>
        </dl>

        <nav aria-label="Entries" data-slot="index"></nav>
      </div>
    </header>

    <main data-slot="categories"></main>

    <template id="index-category">
      <section>
        <h2><a data-slot="title"></a></h2>
        <ol data-slot="entries"></ol>
      </section>
    </template>

    <template id="category">
      <section class="category">
        <header class="category-head content-grid">
          <div class="category-bar">
            <h2 data-slot="title"></h2>
            <p class="label" data-slot="count"></p>
            <a href="#index">Index</a>
          </div>
        </header>

        <div data-slot="sheets"></div>
      </section>
    </template>

    <template id="sheet">
      <section class="sheet content-grid">
        <header class="sheet-head">
          <p class="sheet-number" data-slot="number"></p>
          <h3 data-slot="title"></h3>
          <p class="sheet-lede" data-slot="lede"></p>
        </header>

        <div data-slot="specimen"></div>

        <details class="entry">
          <summary>
            Read the entry
            <span class="label" data-slot="code-count"></span>
          </summary>
          <div class="prose" data-slot="body"></div>
        </details>
      </section>
    </template>

    <template id="specimen">
      <figure class="specimen full-width">
        <figcaption class="check">
          <span class="label">Check</span>
          <span data-slot="check"></span>
        </figcaption>

        <div class="viewport breakout">
          <div class="viewport-bar">
            <span class="viewport-size" data-slot="size"></span>
            <div class="viewport-widths" role="group" aria-label="Frame width">
              <button type="button" data-width="360px">360</button>
              <button type="button" data-width="768px">768</button>
              <button type="button" data-width="100%">Full</button>
            </div>
            <a
              data-slot="open"
              target="_blank"
              title="Open in its own tab"
              aria-label="Open this specimen in its own tab"
            >
              <svg
                viewBox="0 0 16 16"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.25"
                aria-hidden="true"
              >
                <path d="M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5l-5 5" />
              </svg>
            </a>
          </div>
          <iframe data-slot="frame"></iframe>
        </div>
      </figure>
    </template>

    <template id="no-specimen">
      <div class="no-specimen breakout">
        <p>No specimen is drawn for this entry yet.</p>
        <p>Add <code data-slot="file"></code>.</p>
      </div>
    </template>
  </body>
</html>
