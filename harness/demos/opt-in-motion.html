<template data-specimen data-height="360">
  Hover the box. It scales with a transition. Turn on Reduce Motion in the system settings: it still scales, at once.
</template>

<style>
  @layer demo {
    .box {
      width: 8rem;
      height: 8rem;
    }
  }
</style>

<div class="center">
  <div class="box"></div>
</div>

<footer class="status">
  <p>prefers-reduced-motion <output></output></p>
</footer>

<script>
  const query = matchMedia("(prefers-reduced-motion: no-preference)");
  const show = () => (document.querySelector("output").textContent = query.matches ? "no-preference" : "reduce");

  query.addEventListener("change", show);
  show();
</script>
