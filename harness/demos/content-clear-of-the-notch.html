<template data-specimen data-height="460" data-viewport="viewport-fit=cover">
  On a desktop every inset is 0px: the readouts say 0px, 0px and 16px, and only the sheet shows a sulphur band. Open it in its own tab on a phone with a notch or a home indicator. Wherever an inset is not 0px, a sulphur band of that size appears and the text stays clear of it.
</template>

<style>
  @layer demo {
    /* An app shell, so it covers the stage. */
    :root {
      background: var(--bp-panel);
    }

    /* The sulphur is each bar's own background, so it shows only in the
       padding the entry adds. The text sits on the panel inside. */
    .app-header,
    .bottom-bar,
    .sheet {
      position: fixed;
      inset-inline: 0;
      background: var(--bp-fill);

      & > * {
        padding: 1rem 1.5rem;
        background: var(--bp-panel);
      }
    }

    .app-header {
      inset-block-start: 0;
      border-block-end: 1px solid var(--bp-line-faint);
    }

    .bottom-bar,
    .sheet {
      inset-block-end: 0;
      border-block-start: 1px solid var(--bp-line-faint);
    }

    .sheet > * {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 2rem;
    }

    main {
      display: grid;
      justify-items: start;
      gap: 1.5rem;
      padding: 5rem 1.5rem;
    }

    .readings {
      display: grid;
      gap: 0.5rem;
    }
  }
</style>

<header class="app-header"><p><code>.app-header</code></p></header>

<main>
  <div class="readings">
    <p class="label">.app-header padding-block-start <output data-read=".app-header" data-side="paddingBlockStart"></output></p>
    <p class="label">.bottom-bar padding-block-end <output data-read=".bottom-bar" data-side="paddingBlockEnd"></output></p>
    <p class="label">.sheet padding-block-end <output data-read=".sheet" data-side="paddingBlockEnd"></output></p>
  </div>
  <button data-sheet>Show the sheet</button>
</main>

<footer class="bottom-bar"><p><code>.bottom-bar</code></p></footer>

<div class="sheet" hidden>
  <div>
    <p><code>.sheet</code>, with 1rem of its own under the text</p>
    <button data-sheet>Hide the sheet</button>
  </div>
</div>

<script>
  const sheet = document.querySelector(".sheet");

  /* The readouts are the padding the entry's rules gave each element. */
  const read = () => {
    for (const output of document.querySelectorAll("[data-read]")) {
      const { read, side } = output.dataset;
      output.textContent = getComputedStyle(document.querySelector(read))[side];
    }
  };

  for (const button of document.querySelectorAll("[data-sheet]")) {
    button.addEventListener("click", () => (sheet.hidden = !sheet.hidden));
  }

  addEventListener("resize", read);
  read();
</script>
