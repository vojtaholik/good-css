<template data-specimen data-height="400">

<script>
  const measure = () => {
    for (const figure of document.querySelectorAll("figure")) {
      const { height } = figure.querySelector("button").getBoundingClientRect();
      figure.querySelector("output").textContent = `[ ${Math.round(height * 10) / 10}px ]`;
    }
  };

  document.fonts.ready.then(measure);
  measure();
