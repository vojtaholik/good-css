<template data-specimen data-height="520">
  In the first button the sulphur box ends at the top of the capitals and at the baseline, so the padding round it is even and the descenders hang into it. The second has spare room above the capitals and under the baseline. The third is a flex container and is not trimmed. The fourth is a flex button with an icon, and its label is trimmed through the span. At normal size they are 35px, 48px, 48px and 40px tall.
</template>

<style>
  @layer demo {

      display: grid;
      gap: 2rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: start;

      gap: 0.5rem;

    }

    /* The panel is the button's padding. The sulphur box is the text's own box.
       The edge is a shadow, so it adds nothing to the height. */
    .button,
    .button-with-icon {
      --text-box: var(--bp-fill);

      min-width: 0;
      min-height: 0;
      border: 0;
      border-radius: var(--bp-radius-control);
      background: var(--bp-panel);

      font-weight: 400;

      color: var(--bp-ink);
    }

    .button {
      background:
        linear-gradient(var(--text-box) 0 0) content-box,
        var(--bp-panel);
    }

    .button-with-icon > span {
      background: var(--text-box);
    }

    /* 16px at normal size, as in a real icon button. */
    svg {

<script>
  const measure = () => {
    const outputs = document.querySelectorAll("output");

    for (const [index, figure] of document.querySelectorAll("figure").entries()) {
      const { height } = figure.querySelector("button").getBoundingClientRect();
      outputs[index].textContent = `${Math.round(height * 10) / 10}px`;
    }
  };

  document.fonts.ready.then(measure);
  measure();
</script>
