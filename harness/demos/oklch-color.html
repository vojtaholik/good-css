<template data-specimen data-height="320">
  Move the hue. The hover and the subtle color follow, and stay as light as they were.
</template>

<style>
  @layer demo {
    /* The body is a container, so the card can ask how wide the specimen
       is. */
    body {
      container-type: inline-size;
      display: grid;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    /* Swatches sit on white, the way the tokens would be used on a page. */
    .card {
      display: grid;
      gap: 1.25rem;
      padding: 1.25rem;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    .swatch {
      display: grid;
      gap: 0.5rem;

      &::before {
        content: "";
        height: 4.5rem;
        border-radius: var(--bp-radius-control);
        background: var(--swatch);
      }
    }

    .cta {
      justify-self: start;
      border: 0;
      background: var(--primary);
      color: oklch(1 0 none);

      @media (hover: hover) and (pointer: fine) {
        &:hover:not(:disabled) {
          background: var(--primary-hover);
          color: oklch(1 0 none);
        }
      }

      &:active:not(:disabled) {
        background: var(--primary-hover);
        color: oklch(1 0 none);
      }
    }

    .hue {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding-block-start: 1.25rem;
      border-block-start: 1px solid var(--bp-line-faint);
    }

    /* A finger gets 2.75rem of height to land on, and the margins give the
       row its height back. */
    input[type="range"] {
      flex: 1;
      min-width: 6rem;
      min-height: 2.75rem;
      margin-block: -0.75rem;
      accent-color: var(--bp-ink);
    }

    /* Room for three digits, so the slider keeps its width, and its thumb
       its place under a finger, as the value changes. */
    .hue output {
      box-sizing: content-box;
      min-width: 3ch;
      text-align: end;
    }

    /* In a narrow specimen each swatch is a row, a chip beside its name,
       and the slider takes a row of its own under its label and its value.
       The whole card then shows at once, so a move of the hue is seen in
       all of it, and the slider is as long as the card allows. */
    @container (inline-size < 34rem) {
      .card {
        gap: 0.875rem;
        padding: 1rem;
      }

      .swatches {
        grid-template-columns: minmax(0, 1fr);
        gap: 0.5rem;
      }

      .swatch {
        grid-template-columns: 2.5rem minmax(0, 1fr);
        align-items: center;
        gap: 0.75rem;

        &::before {
          height: 1.5rem;
        }
      }

      .hue {
        row-gap: 0.75rem;
        padding-block-start: 0.875rem;

        & span {
          flex: 1;
        }

        & input {
          order: 1;
          flex-basis: 100%;
        }
      }
    }
  }
</style>

<div class="box card">
  <div class="swatches">
    <div class="swatch" style="--swatch: var(--primary)"><code>--primary</code></div>
    <div class="swatch" style="--swatch: var(--primary-hover)"><code>--primary-hover</code></div>
    <div class="swatch" style="--swatch: var(--primary-subtle)"><code>--primary-subtle</code></div>
  </div>
  <button class="cta">Hover me</button>

  <label class="hue">
    <span>Hue of <code>--primary</code></span>
    <input type="range" min="0" max="360">
    <output></output>
  </label>
</div>

<script>
  /* Only the hue changes. Lightness and chroma stay the entry's own. */
  const root = document.documentElement;
  const base = getComputedStyle(root).getPropertyValue("--primary").trim();
  const hue = document.querySelector("input");
  const output = document.querySelector("output");

  const show = () => (output.textContent = hue.value);

  hue.value = base.match(/([\d.]+)\)$/)?.[1] ?? 0;
  show();

  hue.addEventListener("input", () => {
    root.style.setProperty("--primary", `oklch(from ${base} l c ${hue.value})`);
    show();
  });
</script>
