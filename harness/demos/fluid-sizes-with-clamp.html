<template data-specimen data-height="420">
  Change the width. The text is 16px up to a 400px viewport and 28px from 1600px. Open it in its own tab for the full range.
</template>

<style>
  @layer demo {
    main {
      padding: 1.5rem;
    }

    /* The gray bands above and below the text are --space-section. The text
       lies on white. */
    .spaced {
      padding-block: var(--space-section);
      border: 1px solid var(--bp-line-faint);
      border-radius: var(--bp-radius);
      background:
        linear-gradient(var(--bp-panel) 0 0) content-box,
        var(--bp-fill);
    }

    .spaced p {
      padding: 0.5rem 1.5rem;
      font-size: var(--text-body);
    }
  }
</style>

<main>
  <div class="spaced">
    <p>This text is set in <code>--text-body</code>. Make the frame wider and it grows.</p>
  </div>
</main>

<footer class="status">
  <p>viewport <output data-read="viewport"></output></p>
  <p>--text-body <output data-read="text"></output></p>
  <p>--space-section <output data-read="space"></output></p>
</footer>

<script>
  const spaced = document.querySelector(".spaced");
  const px = (value) => `${Math.round(parseFloat(value) * 10) / 10}px`;
  const write = (name, value) => (document.querySelector(`[data-read="${name}"]`).textContent = px(value));

  const read = () => {
    write("viewport", innerWidth);
    write("text", getComputedStyle(spaced.firstElementChild).fontSize);
    write("space", getComputedStyle(spaced).paddingBlockStart);
  };

  addEventListener("resize", read);
  read();
</script>
